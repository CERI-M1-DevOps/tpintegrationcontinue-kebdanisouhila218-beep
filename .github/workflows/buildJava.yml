name: Java CI with Maven-Test and package

on:
 pull_request:
  branches:[main]


jobs:
 Build:
  runs-on: ubuntu-latest 

  steps:
   - uses: actions/checkout@v4
   - uses: action/setup-java@v4
     with: 
       java-version: '21'
       distribution: 'corretto'

   - name: Build with Maven
     run: mvn -B package --file pom.xml

